# Isolated upstream Hermes Agent runtime.
# Build context is pinned to a verified immutable upstream commit; no floating main branch.
# Upstream SECURITY.md describes Hermes as single-tenant and requires whole-process OS isolation
# for untrusted/multi-user production workloads. This profile is not yet production-ready:
# per-tenant isolation, egress policy, and resource limits must be completed before activation.
services:
  hermes-agent:
    image: suly-hermes-agent:2026-11-20
    build:
      context: https://github.com/NousResearch/hermes-agent.git#9f47677483d1b4de4d1a88d37b3b7ca18b18b215
      dockerfile: Dockerfile
    profiles: ["agent-engines"]
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      API_SERVER_ENABLED: "false"
    volumes:
      - hermes-data:/opt/data
    networks:
      - suly-agent-internal
    # No host port is published. The API stays disabled by default. If it is
    # enabled later, require a unique API key and a completed tool/sandbox audit.

volumes:
  hermes-data:

networks:
  suly-agent-internal:
    name: suly-agent-internal
    driver: bridge
