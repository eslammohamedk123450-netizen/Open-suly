# Isolated upstream Hermes Agent runtime.
# Build context is pinned to an exact upstream commit; no floating main branch.
services:
  hermes-agent:
    image: suly-hermes-agent:2026-11-20
    build:
      context: https://github.com/NousResearch/hermes-agent.git#9f47677483d1b4de4d1a88d37b3b7ca18b18b215
      dockerfile: Dockerfile
    profiles: ["agent-engines"]
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      API_SERVER_ENABLED: ${HERMES_API_SERVER_ENABLED:-false}
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:-}
    volumes:
      - hermes-data:/opt/data
    networks:
      - suly-agent-internal
    # No host port is published. The API stays disabled by default. If it is
    # enabled later, require a unique API key and a completed tool/sandbox audit.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  hermes-data:

networks:
  suly-agent-internal:
    name: suly-agent-internal
    driver: bridge
