# Original Hermes Agent source is checked out at its immutable submodule revision.
# This shared Compose profile is development-only and keeps its API disabled.
services:
  hermes-agent:
    image: suly-hermes-agent:2026-11-21
    build:
      context: ./upstream
      dockerfile: Dockerfile
    profiles: ["agent-engines"]
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      API_SERVER_ENABLED: "false"
    volumes:
      - hermes-data:/opt/data
    networks:
      - suly-agent-internal
    # Never enable the API in this shared local profile. Production SULY tasks
    # receive separate instances, workspaces and credentials via the provisioner.

volumes:
  hermes-data:

networks:
  suly-agent-internal:
    name: suly-agent-internal
    driver: bridge
