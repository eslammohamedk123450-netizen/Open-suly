# SULY API: free test deployment.
# Render Free web services sleep after inactivity; this is for testing, not production.
services:
  - type: web
    name: suly-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: WORKER_ENABLED
        value: "false"
      - key: HERMES_AGENT_ENABLED
        value: "false"
      # Must match the owner's verified Supabase Auth email; no owner is hardcoded.
      - key: SULY_OWNER_EMAIL
        sync: false
      # AI stays disabled by application default until the owner configures it.
      # sync:false keeps provider selection and credentials out of source control.
      - key: AI_PROVIDER
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
