name: Platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    name: Client typecheck and web export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Check Expo dependency compatibility
        working-directory: apps/client
        run: npx expo install --check

      - name: Export web build
        run: npm run export:web --workspace @suly/client

  api:
    name: API tests and deployable image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r services/api/requirements-dev.txt

      - name: Compile API
        run: python -m compileall services/api/app

      - name: Run API tests
        working-directory: services/api
        run: python -m pytest -q

      - name: Build API container using its Dockerfile-specific context rules
        run: docker build --pull=false -f services/api/Dockerfile -t suly-api:ci .

      - name: Validate production Compose topology and environment-file paths
        shell: bash
        run: |
          set -euo pipefail
          cp services/api/.env.example .env
          docker compose --env-file .env -f deploy/docker-compose.server.yml config --quiet
          rm -f .env

      - name: Run built API container smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name suly-api-ci -p 127.0.0.1:18080:8000 \
            -e APP_ENV=development \
            -e SUPABASE_URL= \
            -e SUPABASE_PUBLISHABLE_KEY= \
            -e SUPABASE_SECRET_KEY= \
            suly-api:ci
          cleanup() { docker stop suly-api-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request
          base = "http://127.0.0.1:18080"
          deadline = time.monotonic() + 45
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(base + "/health", timeout=2) as response:
                      assert response.status == 200
                      assert json.load(response)["status"] == "ok"
                      assert response.headers.get("X-Content-Type-Options") == "nosniff"
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("API container did not become healthy")
          try:
              urllib.request.urlopen(base + "/ready", timeout=2)
          except urllib.error.HTTPError as response:
              assert response.code == 503
              payload = json.load(response)
              assert payload["status"] == "not_ready"
              assert "server-secret" not in json.dumps(payload)
          else:
              raise SystemExit("Readiness must fail closed without Supabase configuration")
          PY
