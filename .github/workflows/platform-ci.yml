name: Platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    name: Client typecheck and web export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Check Expo dependency compatibility
        working-directory: apps/client
        run: npx expo install --check

      - name: Export web build
        run: npm run export:web --workspace @suly/client

  api:
    name: API tests and deployable image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r services/api/requirements-dev.txt

      - name: Compile API
        run: python -m compileall services/api/app

      - name: Run API tests
        working-directory: services/api
        run: python -m pytest -q

      - name: Build API container using its Dockerfile-specific context rules
        run: docker build --pull=false -f services/api/Dockerfile -t suly-api:ci .
