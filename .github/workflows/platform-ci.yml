name: Platform CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    name: Client typecheck and web export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Check Expo dependency compatibility
        working-directory: apps/client
        run: npx expo install --check

      - name: Export web build
        run: npm run export:web --workspace @suly/client

  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r services/api/requirements-dev.txt

      - name: Compile API
        run: python -m compileall services/api/app

      - name: Run API tests
        working-directory: services/api
        run: python -m pytest -q

      - name: Build dedicated worker image without publishing
        working-directory: services/api
        run: docker build --file Dockerfile.worker --tag suly-worker:ci .

      - name: Verify worker image imports and remains disabled by default
        run: |
          set +e
          output="$(docker run --rm suly-worker:ci 2>&1)"
          status=$?
          set -e
          test "$status" -eq 1
          echo "$output" | grep -q "Worker disabled."
