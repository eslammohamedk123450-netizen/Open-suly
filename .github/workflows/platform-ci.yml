name: Platform CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    name: Client typecheck and web export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Check Expo dependency compatibility
        working-directory: apps/client
        run: npx expo install --check

      - name: Export web build
        run: npm run export:web --workspace @suly/client

  chat-export:
    name: Chat export security tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API test dependencies
        run: pip install -r services/api/requirements-dev.txt

      - name: Run focused chat export tests
        working-directory: services/api
        run: timeout --signal=TERM --kill-after=15s 3m python -m pytest -q tests/test_chat_export.py --tb=short

  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r services/api/requirements-dev.txt

      - name: Compile API
        run: python -m compileall services/api/app

      - name: Run API tests
        working-directory: services/api
        run: timeout --signal=TERM --kill-after=30s 5m python -m pytest -q --tb=short --durations=25 -o faulthandler_timeout=120

      - name: Build dedicated worker image without publishing
        working-directory: services/api
        run: docker build --file Dockerfile.worker --tag suly-worker:ci .

      - name: Verify worker image imports and remains disabled by default
        run: |
          set +e
          output="$(docker run --rm suly-worker:ci 2>&1)"
          status=$?
          set -e
          test "$status" -eq 1
          echo "$output" | grep -q "Worker disabled."
