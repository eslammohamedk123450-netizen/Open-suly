name: OpenCode upstream engine verification

on:
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "engines/opencode/**"
      - "services/api/app/services/opencode_*.py"
      - "services/api/app/services/runtime_provisioner_http.py"
      - "services/api/app/services/project_workspace_store.py"
      - "services/api/app/routers/opencode_sessions.py"
      - "supabase/migrations/*opencode*.sql"
      - "services/api/app/services/runtime_broker_contract.py"
      - "services/api/tests/test_opencode_*.py"
      - "services/api/tests/test_runtime_provisioner_http.py"
      - "services/api/tests/test_project_workspace_store.py"
      - "services/runtime-provisioner/**"
      - ".github/workflows/opencode-engine.yml"
  pull_request:
    paths:
      - ".gitmodules"
      - "engines/opencode/**"
      - "services/api/app/services/opencode_*.py"
      - "services/api/app/services/runtime_provisioner_http.py"
      - "services/api/app/services/project_workspace_store.py"
      - "services/api/app/routers/opencode_sessions.py"
      - "supabase/migrations/*opencode*.sql"
      - "services/api/app/services/runtime_broker_contract.py"
      - "services/api/tests/test_opencode_*.py"
      - "services/api/tests/test_runtime_provisioner_http.py"
      - "services/api/tests/test_project_workspace_store.py"
      - "services/api/tests/test_opencode_task_executor.py"
      - "services/runtime-provisioner/**"
      - ".github/workflows/opencode-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencode-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-upstream:
    name: Verify pinned upstream and server workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout SULY and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify immutable upstream provenance
        run: python engines/opencode/verify_upstream.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SULY API test dependencies
        run: pip install -r services/api/requirements-dev.txt

      - name: Test OpenCode bridge and protocol guards
        working-directory: services/api
        run: python -m pytest -q tests/test_opencode_http.py tests/test_opencode_contract.py tests/test_opencode_sessions.py tests/test_runtime_broker_contract.py tests/test_runtime_provisioner_http.py tests/test_project_workspace_store.py tests/test_opencode_events.py tests/test_opencode_task_executor.py tests/test_opencode_lifecycle.py tests/test_opencode_lifecycle_contract.py

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install upstream workspace from lockfile
        working-directory: engines/opencode/upstream
        run: bun install --frozen-lockfile

      - name: Typecheck original OpenCode server package
        working-directory: engines/opencode/upstream
        run: bun run --cwd packages/server typecheck

      - name: Build isolated OpenCode runtime image
        run: docker build --pull=false -f engines/opencode/Dockerfile -t suly-opencode:ci .

      - name: Smoke-test the original OpenCode server in Docker
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f suly-opencode-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name suly-opencode-smoke \
            -p 127.0.0.1:4096:4096 \
            -e OPENCODE_SERVER_USERNAME=suly \
            -e OPENCODE_SERVER_PASSWORD=ci-smoke-password-not-for-production \
            suly-opencode:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              --user 'suly:ci-smoke-password-not-for-production' \
              http://127.0.0.1:4096/api/info >/tmp/opencode-info.json; then
              python -c "import json; d=json.load(open('/tmp/opencode-info.json')); assert isinstance(d, dict)"
              exit 0
            fi
            sleep 2
          done
          docker logs suly-opencode-smoke
          exit 1

  verify-docker-runtime:
    name: Verify isolated Docker runtime primitives
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: pip install -r services/runtime-provisioner/requirements.txt pytest
      - name: Test provisioner API, gateway contracts, and Docker runtime security
        working-directory: services/runtime-provisioner
        env:
          SULY_PROVISIONER_TOKEN: ${{ secrets.SULY_PROVISIONER_TOKEN || 'ci-test-token-ci-test-token-ci-test-token' }}
          RUNTIME_GATEWAY_ORIGIN: https://runtime.example.test
          OPENCODE_RUNTIME_IMAGE: registry.example/opencode@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          RUNTIME_DB_PATH: /tmp/suly-runtime-ci/runtimes.sqlite3
        run: PYTHONPATH=. pytest -q tests
