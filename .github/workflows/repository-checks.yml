name: Repository baseline checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-baseline:
    name: Validate repository baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required project documents
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "README.md"
            "AGENTS.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "SULY_MASTER_ARCHITECTURE.md"
            "SULY_V1_LAUNCH_BLUEPRINT.md"
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done

      - name: Reject tracked environment and private-key files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env($|\.)|id_rsa$|id_ed25519$|.*\.(pem|p12|pfx|keystore|jks)$)'; then
            echo "A potentially sensitive file is tracked. Remove it and rotate any exposed credentials."
            exit 1
          fi
