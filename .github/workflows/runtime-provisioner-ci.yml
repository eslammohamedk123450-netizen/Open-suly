name: Runtime Provisioner CI

on:
  push:
    branches: [main]
    paths:
      - "services/runtime-provisioner/**"
      - "engines/hermes/**"
      - ".github/workflows/runtime-provisioner-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provisioner:
    name: Isolated runtime provisioner tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install provisioner dependencies
        working-directory: services/runtime-provisioner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Check installed dependency consistency
        working-directory: services/runtime-provisioner
        run: python -m pip check

      - name: Compile provisioner
        working-directory: services/runtime-provisioner
        env:
          PYTHONPATH: .
        run: python -m compileall -q app tests

      - name: Run isolated lifecycle and gateway tests
        working-directory: services/runtime-provisioner
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests

      - name: Pull immutable Python probe image for real Docker network checks
        env:
          RUNTIME_NETWORK_TEST_IMAGE: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
        run: docker pull "$RUNTIME_NETWORK_TEST_IMAGE"

      - name: Verify task bridge host and egress isolation without publishing task ports
        working-directory: services/runtime-provisioner
        env:
          PYTHONPATH: .
          SULY_DOCKER_NETWORK_ISOLATION_TEST: "1"
          RUNTIME_NETWORK_TEST_IMAGE: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
        run: python -m pytest -q tests/test_docker_network_isolation_live.py

      - name: Build runtime provisioner image without publishing
        working-directory: services/runtime-provisioner
        run: docker build --pull=false -t suly-runtime-provisioner:ci .

      - name: Report integration boundary
        run: |
          echo "The live Docker probe verifies task-bridge host-address, default-route, host-service, metadata-IP, and external-egress denial only. It does not verify the separate control-network gateway or production host-firewall policy; runtime acquire remains fail-closed until that gateway is implemented."
